<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>えほん — ロケットは どうして とべるの？</title>
<link rel="icon" href="../../favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" sizes="16x16" href="../../favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32.png" />
<link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
<meta name="theme-color" content="#20242c" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#20242c;font-family:"UD Digi Kyokasho NP-R","Yu Gothic",sans-serif}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .book{position:relative;width:min(96vw,144vh);aspect-ratio:3/2;border-radius:14px;overflow:hidden;
    box-shadow:0 18px 60px rgba(0,0,0,.55);background:#f3ead9}
  .pg{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;pointer-events:none}
  .pg.on{opacity:1}
  .pg img{width:100%;height:100%;object-fit:cover;display:block}
  .nav{position:absolute;top:0;bottom:0;width:32%;cursor:pointer;z-index:5}
  .nav.prev{left:0}.nav.next{right:0}
  .hint{position:fixed;left:0;right:0;bottom:16px;text-align:center;color:#cdb48c;font-size:14px;letter-spacing:.1em;opacity:.85}
  .dots{position:fixed;left:0;right:0;top:14px;display:flex;gap:9px;justify-content:center;z-index:6}
  .dots i{width:9px;height:9px;border-radius:50%;background:#5a5f68;display:inline-block;transition:background .3s}
  .dots i.on{background:#e6b667}
  .home{position:fixed;top:10px;left:14px;z-index:7;color:#cdb48c;font-size:13px;text-decoration:none;
    letter-spacing:.08em;opacity:.85;padding:4px 8px}
</style></head><body>
<a class="home" href="../../index.html">← もくじ</a>
<div class="dots" id="dots"></div>
<div class="stage">
  <div class="book" id="book">
    <div class="pg on"><img src="book_p1.jpg" alt="えほん 1見開きめ"></div>
    <div class="pg"><img src="book_p2.jpg" alt="えほん 2見開きめ"></div>
    <div class="pg"><img src="book_p3.jpg" alt="えほん 3見開きめ"></div>
    <div class="pg"><img src="book_p4.jpg" alt="えほん 4見開きめ"></div>
    <div class="nav prev" onclick="go(-1)"></div>
    <div class="nav next" onclick="go(1)"></div>
  </div>
</div>
<div class="hint">◀ タップ・矢印キーで ページを めくる ▶</div>
<script>
  var pg=document.querySelectorAll('.pg'),i=0,dots=document.getElementById('dots');
  for(var k=0;k<pg.length;k++){var d=document.createElement('i');if(k==0)d.className='on';dots.appendChild(d);}
  var di=dots.querySelectorAll('i');
  function show(n){i=Math.max(0,Math.min(pg.length-1,n));
    for(var k=0;k<pg.length;k++){pg[k].classList.toggle('on',k==i);di[k].classList.toggle('on',k==i);}}
  function go(d){show(i+d);}
  document.addEventListener('keydown',function(e){if(e.key=='ArrowRight'||e.key==' ')go(1);if(e.key=='ArrowLeft')go(-1);});
  try { localStorage.setItem("read:EX1", "1"); } catch(e) {}
</script>
</body></html>
