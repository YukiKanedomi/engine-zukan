<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンジンのなかみ — 育てる機械図鑑</title>
<link rel="icon" href="favicon.ico" sizes="32x32" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#fdf9f0" />
<style>
  :root{
    --paper:#fdf9f0; --ink:#3a4550; --sub:#77808a; --line:#e5ddcc;
    --acc:#c47a4f; --blue:#9cc0d4; --sand:#f6d9b8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--paper); color:var(--ink); line-height:2.0;
    font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif; font-size:15px}
  .page{max-width:560px; margin:0 auto; padding:20px 20px 60px}
  .kyoka{font-family:"UD Digi Kyokasho NK-R","Yu Gothic UI",sans-serif}

  .cover{text-align:center; padding:34px 0 12px; border-bottom:2px solid var(--ink); margin-bottom:22px}
  .cover .series{font-size:.75rem; letter-spacing:.4em; color:var(--sub)}
  .cover h1{font-size:1.9rem; letter-spacing:.12em; margin:8px 0 2px}
  .cover .cap{font-size:.78rem; color:var(--sub); margin-top:12px}

  .shelf{margin:26px 0}
  .shelf h2{font-size:.85rem; letter-spacing:.2em; color:var(--acc); margin:26px 0 10px;
    display:flex; align-items:center; gap:10px}
  .shelf h2::after{content:""; flex:1; border-top:1px dashed var(--line)}
  .shelf ol{list-style:none}
  .shelf li{border-bottom:1px dashed var(--line)}
  .shelf li a, .shelf li .row{display:flex; align-items:center; gap:10px; padding:8px 4px;
    font-size:.9rem; color:inherit; text-decoration:none}
  .shelf li a{border-radius:8px}
  .shelf li a:active{background:#fff}
  .shelf .ico{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); flex:none}
  .shelf .no{font-family:ui-monospace,monospace; color:var(--acc); font-size:.78rem; width:26px; flex:none}
  .shelf li.soon .row{color:#b6bcc2}
  .shelf li.soon .no{color:#cfc4ae}
  .shelf .tag{margin-left:auto; font-size:.66rem; color:var(--sub); flex:none}
  .shelf .tag.new{color:var(--acc); border:1px solid var(--acc); border-radius:999px; padding:0 8px}
  .shelf .tag.read{color:#4e6b49}
  .howto{font-size:.74rem; color:var(--sub); margin-top:18px; padding:8px 10px; background:#fff;
    border-radius:8px; border:1px solid var(--line)}
</style>
</head>
<body>
<div class="page">

  <h1 style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)">エンジンのなかみ — 育てる機械図鑑</h1>
  <div style="margin:6px 0 6px; border-radius:14px; overflow:hidden; border:1.5px solid var(--line)"><img src="assets/title-card.jpg" alt="育てる機械図鑑 エンジンのなかみ 第1巻ロケット編 — 打上げを見送るこどもと犬の水彩表紙" style="width:100%; display:block"></div>

  <div class="shelf" id="shelf"></div>

  <div class="howto">この図鑑は、話が進むほど自然に深くなっていきます。本文だけなら3分、「よりみち」を開くと10分。読んだ話には ✓ がつきます（この端末だけの記録です）。</div>
</div>

<script>
const SHELF = [
  { vol:"第1巻 ロケット編", episodes:[
    { no:"01", title:"ロケットは、すてながら とんでいく", href:"episodes/01.html", ico:"ep01" },
    { no:"02", title:"うしろに投げると、まえにすすむ",     href:"episodes/02.html", ico:"ep02" },
    { no:"03", title:"かたい燃料、ながれる燃料",           href:"episodes/03.html", ico:"ep03" },
    { no:"04", title:"ポンプを回す3つの知恵",             href:"episodes/04.html", ico:"ep04" },
    { no:"05", title:"心臓部、毎分4万回転",               href:"episodes/05.html", ico:"ep05" },
    { no:"06", title:"しぼって、ひろげて、はやくする",     href:"episodes/06.html", ico:"ep06" },
    { no:"07", title:"バネと火薬の、わかれの作法",         href:"episodes/07.html", ico:"ep07" },
    { no:"08", title:"爆音とふるえを、てなずける",         href:"episodes/08.html", ico:"ep08" },
    { no:"09", title:"じっさいの機体で、答え合わせ",       href:"episodes/09.html", ico:"ep09" },
  ]},
  { vol:"えほんの たな（EX）", episodes:[
    { no:"EX1", title:"ロケットは どうして とべるの？", href:"ex/ehon-01/index.html", ico:"book" },
    { no:"EX2", title:"エンジンの なかは どうなってるの？", href:"ex/ehon-02/index.html", ico:"book" },
    { no:"EX3", title:"ロケットの ごはんは なあに？", href:"ex/ehon-03/index.html", ico:"book" },
    { no:"EX4", title:"ポンプは だれが まわすの？", href:"ex/ehon-04/index.html", ico:"book" },
    { no:"EX5", title:"ロケットの しんぞうの おと", href:"ex/ehon-05/index.html", ico:"book" },
    { no:"EX6", title:"らっぱは なんで ひろがってるの？", href:"ex/ehon-06/index.html", ico:"book" },
    { no:"EX7", title:"じょうずな ばいばい", href:"ex/ehon-07/index.html", ico:"book" },
    { no:"EX8", title:"おおきな おとと、みずの まほう", href:"ex/ehon-08/index.html", ico:"book" },
    { no:"EX9", title:"いつか、そらの むこうへ", href:"ex/ehon-09/index.html", ico:"book" },
  ]},
  // 第2巻 飛行機編は、ここにブロックを1つ足すだけ
];

const root = document.getElementById("shelf");
for (const vol of SHELF) {
  if (!vol.episodes.length) continue;
  const h = document.createElement("h2");
  h.className = "kyoka"; h.textContent = vol.vol;
  root.appendChild(h);
  const ol = document.createElement("ol");
  for (const ep of vol.episodes) {
    const li = document.createElement("li");
    const isUp = !!ep.href;
    let read = false;
    try { read = isUp && localStorage.getItem("read:" + ep.no); } catch(e) {}
    if (!isUp) li.className = "soon";
    const inner = isUp ? document.createElement("a") : document.createElement("span");
    inner.className = "row";
    if (isUp) inner.href = ep.href;
    const tag = isUp ? (read ? '<span class="tag read">よんだ ✓</span>' : '<span class="tag new">よめるよ</span>')
                     : '<span class="tag">じゅんびちゅう</span>';
    inner.innerHTML = (ep.ico ? '<img class="ico" src="assets/icons/' + ep.ico + '.jpg" alt="" loading="lazy">' : '')
      + '<span class="no">' + ep.no + '</span><span class="kyoka">' + ep.title + '</span>' + tag;
    li.appendChild(inner);
    ol.appendChild(li);
  }
  root.appendChild(ol);
}
</script>
</body>
</html>
