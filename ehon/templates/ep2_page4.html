<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1536px;height:1024px}

.title{font-family:"UD Digi Kyokasho NP-B",sans-serif;font-size:56px;line-height:1.3;margin-bottom:32px;color:#d96b1e}
.body{font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:28px;line-height:2.0;color:#5a4230}
.body .em{font-family:"UD Digi Kyokasho NP-B",sans-serif;color:#c85a1e}
.pn{position:absolute;left:88px;bottom:64px;font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:26px;color:#a06a38;letter-spacing:.1em;text-shadow:0 1px 0 rgba(255,252,245,.7)}
.pn::after{content:"";display:block;width:52px;height:3px;border-radius:2px;background:#d7a15e;margin-top:10px}
</style></head><body><div class="page">
<img class="art" src="../art/ep2_spread4.png">
<div class="frame"></div>
<div class="tb">
<div class="title">つよく はいて、<br>たかく とぶ</div>
<div class="body">
ゆうやけの そらに、しろい せんが ひとすじ。<br>
あの さきっぽで、エンジンが がんばっている。<br>
——つぎの おはなしは、ロケットの <span class="em">ごはん</span>。<br>
かたい ねんりょうと つめたい ねんりょう、<br>
ふたつの ひみつを のぞいて みよう。
</div></div>
<div class="pn">4</div>
</div></body></html>
