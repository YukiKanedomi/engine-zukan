<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
  @page { size: 240mm 160mm; margin: 0; }
  * { margin:0; padding:0; }
  html,body { background:#fff; }
  .sheet { width:240mm; height:160mm; overflow:hidden; page-break-after:always; }
  .sheet:last-child { page-break-after:auto; }
  .sheet img { width:100%; height:100%; object-fit:cover; display:block; }
</style></head><body>
  <div class="sheet"><img src="book_p1.jpg"></div>
  <div class="sheet"><img src="book_p2.jpg"></div>
  <div class="sheet"><img src="book_p3.jpg"></div>
  <div class="sheet"><img src="book_p4.jpg"></div>
</body></html>
