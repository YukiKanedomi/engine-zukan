<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1536px;height:1024px}
.page{position:relative;width:1536px;height:1024px;overflow:hidden;background:#f6ead6}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tb{position:absolute;left:0;right:0;top:150px;text-align:center;color:#3a4550}
.series{font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:30px;letter-spacing:.55em;color:#a06a38;margin-bottom:34px;text-shadow:0 1px 0 rgba(255,250,240,.8)}
.logowrap{width:1150px;height:330px;margin:0 auto;overflow:hidden;position:relative}
.logo{position:absolute;left:0;top:50%;transform:translateY(-50%);width:1330px;mix-blend-mode:multiply}
.vol{display:inline-block;margin-top:40px;font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:30px;color:#c47a4f;border:3px solid #c47a4f;border-radius:999px;padding:6px 44px;background:rgba(255,250,240,.55)}
.cap{margin-top:36px;font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:28px;letter-spacing:.18em;color:#8a6a4f;text-shadow:0 1px 0 rgba(255,250,240,.8)}
</style></head><body><div class="page">
<img class="art" src="../art/banners/cover.png">
<div class="tb">
<div class="series">育てる機械図鑑</div>
<div class="logowrap"><img class="logo" src="../art/banners/logo-a-white.png" alt="エンジンのなかみ"></div>
<div><span class="vol">第1巻 ロケット編</span></div>
<div class="cap">外がわから、内がわへ。ぜんたいから、細部へ。</div>
</div>
</div></body></html>
