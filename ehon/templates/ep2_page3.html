<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1536px;height:1024px}
.page{position:relative;width:1536px;height:1024px;overflow:hidden;background:#f6efe0}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:22px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 8px 30px rgba(90,60,30,.18);pointer-events:none}
.ovl{position:absolute;inset:0;width:100%;height:100%}
.tb{position:absolute;left:80px;top:80px;width:520px;color:#4a3220;text-shadow:0 1px 0 rgba(255,252,245,.75)}
.label{font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:23px;letter-spacing:.14em;color:#a06a38;display:flex;align-items:center;gap:14px;margin-bottom:22px}
.label::before{content:"";width:30px;height:3px;border-radius:2px;background:#d7a15e;display:inline-block}
.title{font-family:"UD Digi Kyokasho NP-B",sans-serif;font-size:52px;line-height:1.32;color:#e07a2c}
.body{position:absolute;left:80px;bottom:150px;width:680px;font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:27px;line-height:1.95;color:#5a4230;text-shadow:0 1px 0 rgba(255,252,245,.75)}
.body .em{font-family:"UD Digi Kyokasho NP-B",sans-serif;color:#c85a1e}
.pn{position:absolute;left:88px;bottom:64px;font-family:"UD Digi Kyokasho NP-R",sans-serif;font-size:26px;color:#a06a38;letter-spacing:.1em}
.pn::after{content:"";display:block;width:52px;height:3px;border-radius:2px;background:#d7a15e;margin-top:10px}
.alab{font-family:"UD Digi Kyokasho NP-B",sans-serif;font-size:30px}
</style></head><body><div class="page">
<img class="art" src="../art/ep2_spread3.png">
<div class="frame"></div>
<svg class="ovl" viewBox="0 0 1536 1024">
  <defs>
    <marker id="up" markerWidth="10" markerHeight="10" refX="5" refY="1.5" orient="auto"><path d="M5,0 L10,7 L0,7 Z" fill="#2f8f8f"/></marker>
    <marker id="dn" markerWidth="10" markerHeight="10" refX="5" refY="5.5" orient="auto"><path d="M0,0 L10,0 L5,7 Z" fill="#d1502a"/></marker>
  </defs>
  <line x1="470" y1="520" x2="470" y2="330" stroke="#2f8f8f" stroke-width="9" stroke-linecap="round" marker-end="url(#up)"/>
  <line x1="1075" y1="620" x2="1075" y2="850" stroke="#d1502a" stroke-width="9" stroke-linecap="round" marker-end="url(#dn)"/>
  <text x="470" y="300" text-anchor="middle" class="alab" fill="#237070">おしかえす ちから</text>
  <text x="1075" y="590" text-anchor="middle" class="alab" fill="#c0431f">ガスが ぷしゅーっ</text>
</svg>
<div class="tb">
<div class="label">② エンジンの なかみ</div>
<div class="title">もやして、<br>ふきだす へや</div>
</div>
<div class="body">
まるい へやで ねんりょうを「<span class="em">ぼっ</span>」と もやすと、<br>
あつい ガスが らっぱから「<span class="em">ぷしゅーっ</span>」。<br>
たくさん、はやく ふきだすほど、<br>
ロケットは <span class="em">つよく</span> おしあげられるんだ。
</div>
<div class="pn">3</div>
</div></body></html>
